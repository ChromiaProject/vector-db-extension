blockchains:
  vector_example:
    module: vector_example
    config:
      blockstrategy:
        maxblocktime: 2000
      features:
        merkle_hash_version: 2
      gtx:
        modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.gtx.extensions.vectordb.VectorDbGTXModule"
      vector_db_extension:
        collections:
          messages:
            dimensions: 3
            query_max_vectors: 10
            index: hnsw_cosine

  vector_example_test:
    module: integration_test.vector_example_test
    config:
      blockstrategy:
        maxblocktime: 2000
        name: "net.postchain.devtools.OnDemandBlockBuildingStrategy"
      features:
        merkle_hash_version: 2
      signers:
        - x"03a301697bdfcd704313ba48e51d567543f2a182031efd6915ddc07bbcc4e16070"
      gtx:
        modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.gtx.extensions.vectordb.VectorDbGTXModule"
      vector_db_extension:
        collections:
          messages:
            dimensions: 3
            query_max_vectors: 10
            index: hnsw_cosine
  vector_example_test_dynamic_collections:
    module: integration_test.vector_example_test
    config:
      blockstrategy:
        maxblocktime: 2000
        name: "net.postchain.devtools.OnDemandBlockBuildingStrategy"
      features:
        merkle_hash_version: 2
      signers:
        - x"03a301697bdfcd704313ba48e51d567543f2a182031efd6915ddc07bbcc4e16070"
      gtx:
        modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.gtx.extensions.vectordb.VectorDbGTXModule"
  vector_example_test_hnsw_l2:
    module: integration_test.vector_example_test
    config:
      blockstrategy:
        maxblocktime: 2000
        name: "net.postchain.devtools.OnDemandBlockBuildingStrategy"
      features:
        merkle_hash_version: 2
      signers:
        - x"03a301697bdfcd704313ba48e51d567543f2a182031efd6915ddc07bbcc4e16070"
      gtx:
        modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.gtx.extensions.vectordb.VectorDbGTXModule"
      vector_db_extension:
        collections:
          messages:
            dimensions: 3
            query_max_vectors: 10
            index: hnsw_l2
  vector_only_test:
    module: integration_test.vector_only_test
    config:
      blockstrategy:
        maxblocktime: 2000
        name: "net.postchain.devtools.OnDemandBlockBuildingStrategy"
      features:
        merkle_hash_version: 2
      signers:
        - x"03a301697bdfcd704313ba48e51d567543f2a182031efd6915ddc07bbcc4e16070"
      gtx:
        modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.gtx.extensions.vectordb.VectorDbGTXModule"
  vector_example_query_compute_test:
    module: integration_test.query_compute
    config:
      blockstrategy:
        maxblocktime: 2000
        name: "net.postchain.devtools.OnDemandBlockBuildingStrategy"
      features:
        merkle_hash_version: 2
      signers:
        - x"03a301697bdfcd704313ba48e51d567543f2a182031efd6915ddc07bbcc4e16070"
        - x"031B84C5567B126440995D3ED5AABA0565D71E1834604819FF9C17F5E9D5DD078F"
        - x"03B2EF623E7EC933C478135D1763853CBB91FC31BA909AEC1411CA253FDCC1AC94"
      gtx:
        modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.gtx.extensions.vectordb.VectorDbGTXModule"
          - "net.postchain.hybridcompute.HybridComputeGTXModule"
      sync_ext:
        - "net.postchain.hybridcompute.HybridComputeSynchronizationInfrastructureExtension"
      hybridcompute:
        engine: "net.postchain.gtx.extensions.vectordb.VectorDBQueryComputeEngine"
      vector_db_extension:
        collections:
          messages:
            dimensions: 3
  vector_example_embedding_compute_test:
    module: integration_test.embedding_compute
    config:
      blockstrategy:
        maxblocktime: 2000
        name: "net.postchain.devtools.OnDemandBlockBuildingStrategy"
      features:
        merkle_hash_version: 2
      signers:
        - x"03a301697bdfcd704313ba48e51d567543f2a182031efd6915ddc07bbcc4e16070"
        - x"031B84C5567B126440995D3ED5AABA0565D71E1834604819FF9C17F5E9D5DD078F"
        - x"03B2EF623E7EC933C478135D1763853CBB91FC31BA909AEC1411CA253FDCC1AC94"
      gtx:
        modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.gtx.extensions.vectordb.VectorDbGTXModule"
          - "net.postchain.hybridcompute.HybridComputeGTXModule"
      sync_ext:
        - "net.postchain.hybridcompute.HybridComputeSynchronizationInfrastructureExtension"
      hybridcompute:
        engine: "net.postchain.gtx.extensions.vectordb.VectorDBEmbeddingComputeEngine"
      vector_db_extension:
        collections:
          texts:
            dimensions: 384
        embedding_compute:
          model: "sentence-transformers/all-MiniLM-L6-v2"
          timeout_seconds: 5

  vector_db:
    type: library
    module: lib.vector_db

  vector_db_query_compute:
    type: library
    module: lib.vector_db_query_compute

  vector_db_embedding_compute:
    type: library
    module: lib.vector_db_embedding_compute

libs:
  com.chromia.hybridcompute:
    version: 3.35.4

