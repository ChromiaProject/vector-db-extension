blockchains:
  vector_example:
    module: vector_example
    config:
      blockstrategy:
        maxblocktime: 2000
      features:
        merkle_hash_version: 2
      gtx:
        modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.gtx.extensions.vectordb.VectorDbGTXModule"
      vector_db_extension:
        collections:
          messages:
            dimensions: 3
            query_max_vectors: 10
            index: hnsw_cosine
