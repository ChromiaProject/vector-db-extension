image: registry.gitlab.com/chromaway/core-tools/chromia-images/maven-docker-java21:1.0.11@sha256:a985644b469b4d01dcbd726176d69e238d8c7012c077a429beb65f86905d0bd1

include:
  - project: "chromaway/core-infra/gitlab-automation"
    ref: 1.3.7
    file:
      - templates/release.yml
      - templates/maven-dependency-scanning.yml
      - templates/container-dependency-scanning.yml

.setup:
  services:
    - name: docker:29.1.1-dind
      alias: docker
      command: [ "--tls=false" , "--experimental" ]
  artifacts:
    when: always
    paths:
      - "**/*.log"
    expire_in: 1 week

.setup_with_postgres:
  extends:
    - .setup
  before_script:
    - docker run
      --detach
      --name postgres
      --env POSTGRES_PASSWORD=postchain
      --env POSTGRES_USER=postchain
      --env PGDATA=/pgtmpfs
      --env POSTGRES_INITDB_ARGS='--encoding=UTF-8 --lc-collate=C.UTF-8'
      --tmpfs=/pgtmpfs:size=1000m
      --publish 5432:5432
      pgvector/pgvector:pg16@sha256:6146bbae6967442ba8a7ddc517e2a259de62935c0b2055260781b15446a0a7fb
    - export POSTCHAIN_TEST_MASTER_HOST=$(hostname -I | awk '{print $1}') # Finds the IP of the build job container
    - mkdir -p $TEST_MOUNT_DIRECTORY

stages:
  - build
  - deploy
  - dependency-check
  - release

build:
  extends:
    - .setup_with_postgres
  stage: build
  interruptible: true
  except:
    refs:
      - tags
  script:
    - mvn
      $MAVEN_CLI_OPTS
      --activate-profiles docker-push,ci
      verify

deploy-snapshot:
  extends: .setup
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - if $(git rev-parse --is-shallow-repository); then git fetch --unshallow ; fi
    - CURRENT_VERSION=$(git describe --tags --abbrev=0)
    - IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
    - SNAPSHOT_VERSION=$MAJOR.$((MINOR + 1)).0-SNAPSHOT
    - mvn
      $MAVEN_CLI_OPTS
      -Drevision=$SNAPSHOT_VERSION
      -DskipTests
      --activate-profiles docker-push
      clean source:jar deploy

# Triggered by that a semver tag was pushed
deploy:
  extends: .setup
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - mvn
      $MAVEN_CLI_OPTS
      -Drevision=$CI_COMMIT_TAG
      -Djib.to.tags=${CI_COMMIT_TAG},latest
      -DskipTests
      --activate-profiles docker-push,ci
      clean source:jar deploy

deploy_library_chain:
  extends: .deploy_library_chain
  script:
    - cd rell
    - chr install
    - chr build
    - ${CI_PROJECT_DIR}/ci/library_chain/deploy.sh -n vector_db --major 2 --minor 2
    - ${CI_PROJECT_DIR}/ci/library_chain/deploy.sh -n vector_db_query_compute --major 2 --minor 3 --library-description "Library for the Vector DB extension that computes queries asynchronously. EXPERIMENTAL FEATURE, DO NOT USE IN PRODUCTION."
    - ${CI_PROJECT_DIR}/ci/library_chain/deploy.sh -n vector_db_embedding_compute --major 0 --minor 1 --library-description "Library for the Vector DB extension that computes embeddings asynchronously."

gitlab-release:
  extends: .gitlab-release-with-notes
  script:
    - |
      echo "Running the release job."
      include_library_chain_releases
  release:
    name: 'Vector DB extension $CI_COMMIT_TAG'
    description: release_notes.md
    tag_name: '$CI_COMMIT_TAG'

dependency-check:
  extends: .maven-dependency-check
  stage: dependency-check
  interruptible: true
  rules:
    - if: $RUN_DEPENDENCY_CHECK == "true"

container-scanning:
  variables:
    REGISTRY: registry.gitlab.com/chromaway/core/vector-db-extension-chromia-subnode
  parallel:
    matrix:
      - IMAGE: [ vector-db-extension-chromia-subnode ]
        VERSION: [ LATEST, LATEST_SNAPSHOT ]
  only:
    variables:
      - $RUN_DEPENDENCY_CHECK == "true"

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true -s .gitlab-settings.xml -U"
  MAVEN_CLI_NVD_OPTS: "-DnvdDatafeedUrl=https://nvd-data-feeds.chromia.dev/nvdcve-{0}.json.gz"
  POSTCHAIN_DB_URL: jdbc:postgresql://docker/postchain
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_CLI_EXPERIMENTAL: enabled
  TEST_MOUNT_DIRECTORY: /builds/$CI_PROJECT_PATH/mnt

# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_NAME"'
cache:
  paths:
    - .m2/repository
